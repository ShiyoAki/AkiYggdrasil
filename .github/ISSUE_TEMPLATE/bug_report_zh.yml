name: 🐛 Bug 反馈
description: 中文 Bug 反馈模板
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 反馈！提交前请先确认：
        - 使用的是**最新版本**，你遇到的问题可能已经在更新版本中修复；
        - 已**搜索**是否有人提交过相似的问题，避免重复打开相同的 Issue。

        > 本项目使用生成式人工智能辅助开发，你提供的信息越详细，越有助于定位和修复问题。
  - type: checkboxes
    attributes:
      label: 我已确认
      options:
        - label: 我使用的是最新版本
          required: true
        - label: 我搜索过相似问题，没有重复
          required: true
  - type: input
    attributes:
      label: Minecraft 与模组加载器版本
      description: 例如：NeoForge 21.1.x / Minecraft 1.21.1
      placeholder: "例如：NeoForge 21.1.0 / Minecraft 1.21.1"
    validations:
      required: true
  - type: input
    attributes:
      label: AkiYggdrasil 版本
      description: 可从 mods 目录的 jar 文件名确认
      placeholder: "例如：0.1.0"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 服务器类型
      description: 使用的服务端与启动方式
      options:
        - NeoForge 原版服务端
        - Youer / Paper + NeoForge 混合端
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 发生了什么？预期应该是什么？
      placeholder: 描述出现的问题现象
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      description: 按顺序写出复现该问题的操作步骤
      placeholder: |
        1. 启动服务器
        2. 使用某个皮肤站账号登录
        3. 触发问题…
  - type: textarea
    attributes:
      label: 日志与崩溃报告
      description: 请提供 latest.log、crash-reports 等（可直接拖拽文件上传），注意隐藏敏感信息
  - type: textarea
    attributes:
      label: 其他补充
      description: 截图、相关配置文件等（可选）
